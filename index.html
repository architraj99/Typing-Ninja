<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Keyboard Ninja</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <main class="game-shell">
            <header class="topbar">

                <div>
                    <p class="eyebrow">ARCADE TYPING</p>
                    <h1>KEYBOARD NINJA</h1>
                </div>

                <div class="status-strip">
                    <span>READY</span>
                    <strong id="clock">00:00</strong>
                </div>
            </header>

            <section id="playfield" class="playfield" aria-label="Typing Arena">

                <div id="wordLayer" class="word-layer" aria-live="off"></div>

                <div class="center-card" id="startCard">
                    <span class="badge">KEYBOARD ONLY</span>
                    <h2>Words fall. You Type.</h2>
                    <p>Clear each word before it reaches the floor.</p>
                    <p class="start-key">PRESS ENTER TO START</p>
                </div>

                <div class="typing-dock" id="typingDock" hidden>
                    <span class="prompt">TYPE</span>
                    <strong id="typedText">_</strong>
                </div>

            </section>

            <footer class="footerbar">
                <span>ENTER Start</span>
                <span>ESC Pause</span>
                <span>R Restart</span>
            </footer>

        </main>
        
        <script src="script.js"></script>

    </body>
</html>
