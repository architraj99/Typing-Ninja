<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Keyboard Ninja</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <main class="game-shell">
            <header class="topbar">

                <div>
                    <p class="eyebrow">ARCADE TYPING</p>
                    <h1>KEYBOARD NINJA</h1>
                </div>

                <div class="status-strip">

                    <span>SCORE <strong id="score">0000</strong> </span>

                    <span>STREAK <strong id="streak">0</strong> </span>

                    <span>ACC <strong id="accuracy">100%</strong> </span>

                    <span>TIME <strong id="clock">00:00</strong> </span>

                    <span class="life-box">LIVES <strong id="lives">♥ ♥ ♥</strong> </span>
                </div>
            </header>

            <section id="playfield" class="playfield" aria-label="Typing Arena">

                <div id="wordLayer" class="word-layer" aria-live="off"></div>

                <aside id="wpmMeter" class="wpm-meter" aria-label="Live words per minute">
                    <span>LIVE WPM</span>
                    <strong id="wpmValue">0</strong>

                    <div class="wpm-track">
                        <i id="wpmFill" class="wpm-fill"></i>
                    </div>

                    <small id="placeLabel">BULDING PACE</small>
                </aside>

                <div id="dangerLine" class="danger-line">
                    <span>DANGER LINE</span>
                </div>

                <div class="center-card" id="startCard">
                    <span class="badge">KEYBOARD ONLY</span>
                    <h2>Words fall. You Type.</h2>
                    <p>Clear each word before it reaches the floor.</p>
                    <p class="start-key">PRESS ENTER TO START</p>
                </div>

                <div class="typing-dock" id="typingDock" hidden>
                    <span class="prompt">TYPE</span>
                    <strong id="typedText">_</strong>
                    <span class="cleared-count">CLEARED <b id="cleared">0</b> </span>
                </div>

            </section>

            <footer class="footerbar">
                <span>ENTER Start</span>
                <span>ESC Pause</span>
                <span>R Restart</span>
            </footer>

        </main>
        
        <script src="script.js"></script>

    </body>
</html>
